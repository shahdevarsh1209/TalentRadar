org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Compile Kotlin inside the Gradle JVM rather than a second daemon JVM,
# which low-memory machines cannot always spare.
kotlin.compiler.execution.strategy=in-process
